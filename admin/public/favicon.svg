<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradient for the Nest/Event Symbol -->
    <linearGradient id="nestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Nest / Orbit Ring (Representing Gathering & Community) -->
    <path d="M 30 70 C 30 35, 60 10, 100 10 C 140 10, 170 35, 170 70 C 170 95, 150 115, 130 120" 
          fill="none" 
          stroke="url(#nestGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.4" />

    <path d="M 170 110 C 170 135, 145 160, 100 160 C 55 160, 30 135, 30 110" 
          fill="none" 
          stroke="url(#nestGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.8" />

    <!-- Inner Interlocking Dynamic Swirls -->
    <path d="M 60 90 Q 100 50 140 90 Q 100 140 60 90 Z" 
          fill="url(#nestGrad)" 
          opacity="0.15" />

    <!-- Central Spark / Star (The core "Event" happening inside the "Nest") -->
    <g transform="translate(100, 85)">
      <!-- Glowing Backdrop -->
      <circle cx="0" cy="0" r="22" fill="url(#nestGrad)" filter="url(#glow)" opacity="0.6" />
      
      <!-- Four-point Star / Sparkle -->
      <path d="M 0 -26 C 2 -10, 10 -2, 26 0 C 10 2, 2 10, 0 26 C -2 10, -10 2, -26 0 C -10 -2, -2 -10, 0 -26 Z" 
            fill="#ffffff" />
    </g>

    <!-- Orbiting Accent Nodes -->
    <circle cx="145" cy="55" r="5" fill="#ec4899" />
    <circle cx="55" cy="120" r="4" fill="#6366f1" />
  </g>
</svg>
